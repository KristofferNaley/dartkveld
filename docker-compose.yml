# Dartkveld kobler seg til en eksisterende PostgreSQL-server.
# Opprett rolle og database der først (se README), og sett DATABASE_URL i .env.
services:
  app:
    build: .
    image: dart:latest
    container_name: dart
    restart: unless-stopped
    env_file: .env
    ports:
      # Bare lokalt på verten; reverse proxy / tunnel tar seg av offentlig tilgang
      - "127.0.0.1:${APP_PORT:-3014}:3000"
    networks:
      - default
      - db

networks:
  # Docker-nettverket der Postgres-serveren ligger (standard: backend).
  # Kjører Postgres utenfor Docker, kan du peke DATABASE_URL mot host.docker.internal
  # eller en IP i stedet.
  db:
    external: true
    name: ${DB_NETWORK:-backend}
